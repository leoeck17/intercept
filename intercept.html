  const space=UTYPE[u.type].mag-u.mag;
  const take=Math.min(space,G.reserve[u.pool]);
  if(take<=0) return flash('magazine full or reserve empty');
  u.mag+=take; G.reserve[u.pool]-=take; u.usedLull=true;
  logMsg('info',`${u.name} reloaded +${take} (${u.pool} reserve ${G.reserve[u.pool]} left)`);
  render();
}
function lullRelocateStart(u){
  if(u.usedLull) return flash('already acted this lull turn');
  startMove(u);
}
function lullRearm(a){
  if(a.usedLull) return flash('already acted this lull turn');
  const base=targetById(a.baseId);
  if(a.state==='airborne') return flash('recall it first — it must be on the ground');
  if(a.state==='recovering') return flash('still recovering — available next turn');
  if(!base||base.dead) return flash('home airbase gone');
  if(a.ammo>=a.load) return flash('already fully armed');
  a.ammo=a.load; a.usedLull=true;                 // sorties are spent on launch, not rearm
  logMsg('info',`${a.name} rearmed at ${base.name} (${a.sortiesLeft} sorties left)`);
  render();
}
function endLullTurn(){
  [...G.units,...G.aircraft].forEach(u=>u.usedLull=false);
  if(G.enemyVP>=ceilingNow()) return endGame();
  lullTurn();
}

/* ================= AIRCRAFT =================
   A squadron has a finite number of sorties, and a sortie has an endurance:
   launch costs a sortie, it may stay on station LOITER_MAX turns (~1 hour), and
   recovering (or being ordered home) takes a turn on the ground. */
const LOITER_MAX=4;                       // fallback; each type carries its own `loiter`
const loiterOf=a=>a.loiter||LOITER_MAX;
function launchAC(a){
  if(a.dead) return;
  if(a.state==='airborne') return flash(a.name+' is already airborne');
  if(a.state==='recovering') return flash(a.name+' is recovering — available next turn');
  const base=targetById(a.baseId);
  if(!base||base.dead) return flash('airbase lost');
  if(a.sortiesLeft<=0) return flash(a.name+' has no sorties left');
  if(a.ammo<=0) return flash('no loadout — rearm at the airbase first');
  a.state='airborne'; a.col=base.col; a.row=base.row;
  a.airborneTurns=0; a.sortiesLeft--;
  logMsg('info',`${a.name} airborne from ${base.name} (${a.sortiesLeft} sorties left, ${loiterOf(a)} turns on station)`);
  render();
}
function recallAC(a){
  if(a.state!=='airborne') return;
  a.state='recovering'; a.col=null; a.row=null; a.airborneTurns=0;
  logMsg('info',`${a.name} egressing — on the ground next turn.`);
  render();
}
// Redeploy a squadron that is on the ground to another surviving airfield. It is in
// transit for a turn, so moving out ahead of a raid costs you a turn of cover.
function divertAC(a){
  if(a.dead) return;
  if(a.state==='airborne') return flash('recall it first — it must be on the ground');
  if(a.state==='recovering') return flash(a.name+' is already in transit');
  const bases=G.targets.filter(t=>t.airbase&&!t.dead);
  if(bases.length<2) return flash('no other airfield to redeploy to');
  const i=bases.findIndex(b=>b.id===a.baseId);
  const next=bases[(i+1)%bases.length];
  a.baseId=next.id; a.state='recovering';
  logMsg('info',`${a.name} redeploying to ${next.name} — arrives next turn.`);
  render();
}
// called once per turn: age airborne squadrons, force bingo-fuel recoveries, land recoveries
function tickAircraft(){
  for(const a of G.aircraft){
    if(a.dead) continue;
    if(a.state==='recovering'){
      let base=targetById(a.baseId);
      if(!base||base.dead){                       // its field went while it was inbound
        const alt=G.targets.filter(t=>t.airbase&&!t.dead);
        if(alt.length){ a.baseId=alt[0].id; base=alt[0];
          logMsg('warn',`${a.name} diverts to ${base.name} in transit.`); }
        else { killSquadron(a,'lost — no airfield to recover to'); continue; }
      }
      a.state='ready'; logMsg('info',`${a.name} recovered at ${base.name}.`);
      continue;
    }
    if(a.state==='airborne'){
      a.airborneTurns=(a.airborneTurns||0)+1;
      if(a.airborneTurns>=loiterOf(a)){
        a.state='recovering'; a.col=null; a.row=null; a.airborneTurns=0;
        logMsg('warn',`${a.name} bingo fuel — returning to base.`);
      }
    }
  }
}

/* ================= MOVEMENT (player) =================
   Ground batteries are emplaced: they relocate ONLY during a lull, and only 1 hex
   (~50 km — a march plus re-emplacement). Ships and squadrons manoeuvre every turn. */
function terrainOK(u,hex){
  if(deployBlocked(hex.col,hex.row)) return false;     // neutral ground — no deployment
  if(u.kind==='ac') return true;                       // aircraft ignore terrain
  return u.sea ? !isLand(hex.col,hex.row) : isLand(hex.col,hex.row);
}
function moveAllowance(u){
  if(u.dead) return 0;
  if(u.kind==='ac') return u.state==='airborne' ? u.move : 0;   // squadrons: move 4
  if(u.type==='DDG') return G.inLull ? 2 : 1;                   // ships: 1 combat / 2 lull
  return G.inLull ? 1 : 0;                                      // batteries: lull only, 1 hex
}
// movement is spent hex by hex, so a squadron with move 4 can go 2 now and 2 later
function moveRemaining(u){ return moveAllowance(u)-(u.moveUsed||0); }
function moveBlockedMsg(u){
  if(u.kind==='ac') return u.state==='airborne'?'no movement left this turn':'squadron is on the ground — launch it first';
  if(u.type==='DDG') return 'ship has used its movement this turn';
  return G.inLull ? 'battery has already acted this lull turn'
                  : 'batteries are emplaced — they can only relocate during a lull (1 hex ≈ 50 km)';
}
// every hex this unit may legally move to right now, given what it has left
function legalMoves(u){
  const out=[]; const left=moveRemaining(u);
  if(left<=0 || u.col==null) return out;
  if(u.kind!=='ac' && u.type!=='DDG' && G.inLull && u.usedLull) return out;  // battery/radar already acted
  for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++){
    const d2=dist({col:u.col,row:u.row},{col:c,row:r});
    if(d2>=1 && d2<=left && terrainOK(u,{col:c,row:r})) out.push({col:c,row:r});
  }
  return out;
}
function startMove(u){
  if(u.col==null && u.kind==='ac') return flash('squadron is on the ground — launch it first');
  const moves=legalMoves(u);
  if(!moves.length) return flash(moveBlockedMsg(u));
  G.setupUnit={mode:'move',u}; G.selUnit=u.uid;
  flash(`${u.name}: ${moveRemaining(u)} hex${moveRemaining(u)>1?'es':''} left — click a highlighted hex`);
  render();
}
/* ---- movement undo: every step is recorded so it can be walked back ---- */
function pushMoveUndo(u){
  (G.moveUndo=G.moveUndo||[]).push({uid:u.uid,col:u.col,row:u.row,
    moveUsed:u.moveUsed||0, usedLull:!!u.usedLull});
}
function undoMove(){
  const h=G.moveUndo||[];
  if(!h.length) return flash('nothing to undo');
  const s=h.pop();
  const u=unitById(s.uid); if(!u) return;
  u.col=s.col; u.row=s.row; u.moveUsed=s.moveUsed; u.usedLull=s.usedLull;
  G.setupUnit=null;
  logMsg('info',`${u.name} movement undone → ${colLabel(u.col)}${u.row+1}`);
  render();
}
function moveSel(hex){
  const s=G.setupUnit; if(!s) return;
  const u=s.u;
  if(s.mode==='setup'){
    if(u.kind==='ac') return;
    if(!terrainOK(u,hex)) return flash(u.sea?'ships go on sea hexes':'batteries go on land');
    u.col=hex.col;u.row=hex.row; G.setupUnit=null; render(); return;
  }
  if(s.mode==='move'){
    const left=moveRemaining(u);
    if(left<=0) return flash(moveBlockedMsg(u));
    if(!terrainOK(u,hex)) return flash(u.sea?'ships stay at sea':'batteries stay on land');
    const d2=dist({col:u.col,row:u.row},hex);
    if(d2<1){ G.setupUnit=null; render(); return; }
    if(d2>left) return flash(`${u.name} has ${left} hex${left>1?'es':''} left — that is ${d2}`);
    pushMoveUndo(u);
    u.col=hex.col; u.row=hex.row; u.moveUsed=(u.moveUsed||0)+d2;
    // in a lull, relocating a land battery/radar IS its one action for the turn
    if(G.inLull && u.kind==='unit' && u.type!=='DDG') u.usedLull=true;
    const rest=moveRemaining(u);
    logMsg('info',`${u.name} → ${colLabel(hex.col)}${hex.row+1}${rest>0?` (${rest} left)`:''}`);
    // keep the unit armed while it still has movement, so a move can be split
    if(rest>0 && legalMoves(u).length) G.setupUnit={mode:'move',u};
    else G.setupUnit=null;
    render(); return;
  }
}

/* ================= END ================= */
/* Every phase change clears the current selection: a unit or contact picked in one phase
   almost never means the same thing in the next, and a stale highlight is misleading. */
function setPhase(p){
  if(G.phase!==p){ G.selUnit=null; G.selThreat=null; G.setupUnit=null; G.popup=null; }
  G.phase=p;
}
function bandName(vp){
  const v=(vp==null)?G.enemyVP:vp;
  for(const [n,c] of bandBar()) if(v<=c) return n;
  return 'Defeat';
}
function bandColour(vp){
  switch(bandName(vp)){
    case 'Decisive': return 'var(--good)';
    case 'Solid':    return '#7ee787';
    case 'Marginal': return 'var(--warn)';
    default:         return 'var(--bad)';
  }
}
function endGame(){
  setPhase('over');
  logMsg('big',`GAME OVER — enemy VP ${G.enemyVP}/${ceilingNow()} → ${bandName()}`);
  render();
  if(typeof openAAR==='function') openAAR();
}

/* ================= UI HELPERS ================= */
function flash(msg){ const b=document.getElementById('banner');
  b.textContent=msg; b.style.color='var(--warn)';
  clearTimeout(flash._t); flash._t=setTimeout(render,1400); }

// ================= RENDER =================
const SVGNS="http://www.w3.org/2000/svg";
function el(tag,attrs,txt){ const e=document.createElementNS(SVGNS,tag);
  for(const k in attrs)e.setAttribute(k,attrs[k]); if(txt!=null)e.textContent=txt; return e; }

function render(){
  renderBoard();
  // Mid-animation only the board moves: the panels read t.col/t.row, which are already at
  // their final values (the animation is threatDisplayPos walking t.path). Rebuilding the
  // toolbar, contact list, roster and log four times a second is pure churn.
  if(G&&G.anim) return;
  renderSide(); renderPopup();
}

/* ================= FLOATING POPUP =================
   Context panels that belong next to the thing you clicked rather than in a side panel:
   the fire-assignment box, and airbase operations. */
function openPopup(kind,id,ev){
  G.popup={kind,id,
    x: ev&&ev.clientX!=null ? ev.clientX : Math.round(window.innerWidth/2),
    y: ev&&ev.clientY!=null ? ev.clientY : Math.round(window.innerHeight/3)};
  render();
}
function closePopup(){ if(G.popup){ G.popup=null; render(); } }

/* The popup behaves like a window: drag it by the title bar and it stays where you put it,
   across re-renders and across different popups, until you double-click to re-snap. */
let POPUP_PIN=null;                       // {x,y} once the player has positioned it
function placePopup(p){
  const w=p.offsetWidth||318, h=p.offsetHeight||300;
  let x,y;
  if(POPUP_PIN){                          // player-placed — honour it, just keep it on screen
    x=POPUP_PIN.x; y=POPUP_PIN.y;
  } else {                                // auto: beside the click, flipped to fit
    x=G.popup.x+16; y=G.popup.y-30;
    if(x+w>window.innerWidth-10) x=G.popup.x-w-16;
  }
  x=Math.max(4,Math.min(x,window.innerWidth-w-4));
  y=Math.max(4,Math.min(y,window.innerHeight-Math.min(h,window.innerHeight-8)-4));
  p.style.left=Math.round(x)+'px'; p.style.top=Math.round(y)+'px';
}
function makePopupDraggable(p){
  const hdr=p.querySelector('.phdr'); if(!hdr) return;
  hdr.addEventListener('pointerdown',e=>{
    if(e.target.closest('button')) return;            // the ✕ is not a drag handle
    e.preventDefault();
    const r=p.getBoundingClientRect();
    const dx=e.clientX-r.left, dy=e.clientY-r.top;
    p.classList.add('dragging');
    try{ hdr.setPointerCapture(e.pointerId); }catch(_){}
    const move=ev=>{
      const w=p.offsetWidth, h=p.offsetHeight;
      const x=Math.max(4,Math.min(ev.clientX-dx, window.innerWidth-w-4));
      const y=Math.max(4,Math.min(ev.clientY-dy, window.innerHeight-h-4));
      p.style.left=Math.round(x)+'px'; p.style.top=Math.round(y)+'px';
      POPUP_PIN={x,y};                                // remember where it was dropped
    };
    const up=ev=>{
      p.classList.remove('dragging');
      try{ hdr.releasePointerCapture(ev.pointerId); }catch(_){}
      hdr.removeEventListener('pointermove',move);
      hdr.removeEventListener('pointerup',up);
      hdr.removeEventListener('pointercancel',up);
    };
    hdr.addEventListener('pointermove',move);
    hdr.addEventListener('pointerup',up);
    hdr.addEventListener('pointercancel',up);
  });
  // double-click the bar to forget the pinned spot and snap back to the click point
  hdr.addEventListener('dblclick',e=>{
    if(e.target.closest('button')) return;
    POPUP_PIN=null; placePopup(p); flash('popup position reset');
  });
}
window.addEventListener('resize',()=>{ const p=document.getElementById('popup');
  if(p&&p.classList.contains('on')) placePopup(p); });

// squadrons based at this airfield, with their operations
function airbaseHTML(tg){
  const based=G.aircraft.filter(a=>!a.dead&&a.baseId===tg.id);
  let h=`<div class="k" style="margin-bottom:7px">Airbase · ${tg.dead?'<span style="color:var(--bad)">destroyed</span>'
        :`integrity ${tg.integRem}/${tg.integ}`} · ${colLabel(tg.col)}${tg.row+1}</div>`;
  if(tg.dead) return h+`<div class="hint">The field is gone. Anything still on it was lost; airborne squadrons diverted.</div>`;
  if(!based.length) return h+`<div class="hint">No squadrons based here.</div>`;
  for(const a of based){
    const onSta=a.state==='airborne'?` · on station ${a.airborneTurns||0}/${loiterOf(a)}`:'';
    h+=`<div class="unit" style="align-items:flex-start">
      <span class="badge" style="background:${a.color};color:#04121f">${a.type}</span>
      <div style="flex:1">
        <div>${a.name} <span class="k">${a.state}${onSta}</span>${a.cue?' <span class="tag">cue +3</span>':''}</div>
        <div class="k" style="font-size:11px">ammo ${a.ammo}/${a.load} · sorties ${a.sortiesLeft}</div>
        <div class="step" style="margin-top:4px">`;
    if(a.state==='airborne'){
      h+=`<button data-ab="recall" data-u="${a.uid}">Recall</button>`;
    } else {
      const cant = a.state==='recovering'||a.sortiesLeft<=0||a.ammo<=0;
      h+=`<button data-ab="launch" data-u="${a.uid}" ${cant?'disabled':''}
            title="${a.state==='recovering'?'recovering':a.sortiesLeft<=0?'no sorties left':a.ammo<=0?'no loadout — rearm first':'launch'}">▲ Launch</button>`;
      h+=`<button data-ab="divert" data-u="${a.uid}" ${a.state==='recovering'?'disabled':''}>⇢ Base</button>`;
      if(G.phase==='lull') h+=`<button data-ab="rearm" data-u="${a.uid}" ${a.usedLull||a.ammo>=a.load?'disabled':''}>Rearm</button>`;
    }
    h+=`</div></div></div>`;
  }
  const ready=based.filter(a=>a.state==='ready'&&a.sortiesLeft>0&&a.ammo>0);
  if(ready.length>1) h+=`<div class="step" style="margin-top:8px">
      <button class="primary" data-ab="launchall" data-u="${tg.id}">▲ Launch all ${ready.length}</button></div>`;
  return h;
}
function renderPopup(){
  const p=document.getElementById('popup');
  if(!p) return;
  if(!G.popup){ p.classList.remove('on'); return; }
  let title='', body='';
  if(G.popup.kind==='threat'){
    const t=G.threats.find(x=>x.tid===G.popup.id);
    if(!t || !isDetected(t)){ G.popup=null; p.classList.remove('on'); return; }
    title=`Assign fire vs ${t.name}${t.type==='ballistic'?' ⚑':''}`;
    body=assignmentHTML(t);
  } else if(G.popup.kind==='airbase'){
    const tg=targetById(G.popup.id);
    if(!tg){ G.popup=null; p.classList.remove('on'); return; }
    title=tg.name; body=airbaseHTML(tg);
  } else { G.popup=null; p.classList.remove('on'); return; }

  p.innerHTML=`<div class="phdr" title="Drag to move · double-click to re-snap">
                 <span class="grip">⠿</span><b style="flex:1">${title}</b>
                 <button id="popClose">✕</button></div>
               <div class="pbody">${body}</div>`;
  p.classList.add('on');
  placePopup(p);
  makePopupDraggable(p);

  const cl=document.getElementById('popClose'); if(cl) cl.onclick=closePopup;
  wireEngage();                               // ± and target-picker buttons
  p.querySelectorAll('[data-ab]').forEach(b=>{ b.onclick=(e)=>{
    e.stopPropagation();
    const act=b.dataset.ab;
    if(act==='launchall'){
      const tg=targetById(b.dataset.u);
      G.aircraft.filter(a=>!a.dead&&a.baseId===tg.id&&a.state==='ready'&&a.sortiesLeft>0&&a.ammo>0)
        .forEach(a=>launchAC(a));
      render(); return;
    }
    const a=unitById(+b.dataset.u); if(!a) return;
    if(act==='launch') launchAC(a);
    else if(act==='recall') recallAC(a);
    else if(act==='divert') divertAC(a);
    else if(act==='rearm') lullRearm(a);
  };});
}

function renderBoard(){
  const svg=document.getElementById('board');
  const W=HS + (COLS-1)*1.5*HS + HS + 8;
  const H=SQRT3*HS*(ROWS+0.5)+12;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.setAttribute('width',W); svg.setAttribute('height',H);
  while(svg.firstChild)svg.removeChild(svg.firstChild);

  // hexes
  for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++){
    const {x,y}=hexCenter(c,r);
    const fill = (G.hexFill&&G.hexFill[c]) ? G.hexFill[c][r] : (isLand(c,r)?'#22391e':'#12435c');
    const poly=el('polygon',{points:hexPoints(x,y),fill,
      stroke:'#0b0f14','stroke-width':0.7,'data-c':c,'data-r':r});
    poly.style.cursor='pointer';
    svg.appendChild(poly);
  }
  // coordinate labels on edges
  for(let c=0;c<COLS;c++){ const {x,y}=hexCenter(c,0);
    svg.appendChild(el('text',{x,y:y-HS+7,'text-anchor':'middle',class:'hexlabel'},colLabel(c))); }
  for(let r=0;r<ROWS;r++){ const {x,y}=hexCenter(0,r);
    svg.appendChild(el('text',{x:x-HS+3,y:y+3,'text-anchor':'middle',class:'hexlabel'},r+1)); }

  // ---- no-deploy region (scenario-forbidden ground, e.g. neutral territory) ----
  if(G.noDeploy && G.noDeploy.length && G.phase!=='editor'){
    for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++){
      if(!deployBlocked(c,r)) continue;
      const {x,y}=hexCenter(c,r);
      svg.appendChild(el('polygon',{points:hexPoints(x,y),fill:'#8b98a5',
        opacity:0.16,'pointer-events':'none'}));
    }
  }
  // ---- coverage envelopes: faint wash + one outline around each COMBINED union ----
  if(G.phase!=='editor'){
    for(const key of ['radar','cruise','abm']){
      if(!G.layers || !G.layers[key]) continue;
      const L=COVERAGE_LAYERS[key];
      drawCoverageLayer(svg, coverageGridFor(L.src()), L.colour);
    }
  }
  // ---- selection overlays (drawn under tokens; never intercept clicks) ----
  const selU = G.selUnit!=null ? unitById(G.selUnit) : null;
  if(selU && !selU.dead && selU.col!=null){
    // show the ENGAGEMENT envelope for anything that shoots — a destroyer's weapon reach,
    // not its radar horizon. Pure sensors (radars) have no weapon, so show detection.
    const armed = TOHIT[selU.type] && !selU.sensor;
    const rng = armed ? unitRange(selU) : (selU.detect || unitRange(selU));
    if(rng>0){
      // dashed so a transient selection reads differently from the standing coverage layers
      drawCoverageLayer(svg, coverageGridFor([{col:selU.col,row:selU.row,r:rng}]),
        selU.color, {width:2.5, opacity:0.95, dash:'6 3'});
    }
    const uc=hexCenter(selU.col,selU.row);
    svg.appendChild(el('polygon',{points:hexPoints(uc.x,uc.y),fill:'none',
      stroke:selU.color,'stroke-width':2,'stroke-opacity':0.9,'pointer-events':'none'}));
  }
  const selT = G.selThreat!=null ? G.threats.find(x=>x.tid===G.selThreat) : null;
  if(selT){
    const ts=threatScreen(selT);
    for(const u of shooters()){
      if(u.col==null || !canEngage(u,selT)) continue;
      const us=unitScreen(u);
      svg.appendChild(el('line',{x1:us.x,y1:us.y,x2:ts.x,y2:ts.y,stroke:'#3fb950',
        'stroke-width':1.5,'stroke-dasharray':'4 3','stroke-opacity':0.65,'pointer-events':'none'}));
      svg.appendChild(el('circle',{cx:us.x,cy:us.y,r:16,fill:'none',stroke:'#3fb950',
        'stroke-width':2,'stroke-opacity':0.9,'pointer-events':'none'}));
    }
    svg.appendChild(el('circle',{cx:ts.x,cy:ts.y,r:15,fill:'none',stroke:'#3fb950',
      'stroke-width':1.5,'stroke-dasharray':'3 3','stroke-opacity':0.7,'pointer-events':'none'}));
  }
  // ---- legal move destinations for the unit armed to move ----
  if(G.setupUnit && G.setupUnit.mode==='move'){
    for(const h of legalMoves(G.setupUnit.u)){
      const {x,y}=hexCenter(h.col,h.row);
      svg.appendChild(el('polygon',{points:hexPoints(x,y),fill:'#e3b341',opacity:0.22,
        stroke:'#e3b341','stroke-width':1.5,'stroke-opacity':0.8,'pointer-events':'none'}));
    }
  }

  // targets — military installations are square, cities are round (and never die).
  // Airbases are clickable: they open an operations popup for the squadrons based there.
  for(const t of G.targets){
    const {x,y}=hexCenter(t.col,t.row);
    const col=t.city?'#2f81f7':'#8957e5';
    const g=el('g',{});
    const based=t.airbase?G.aircraft.filter(a=>!a.dead&&a.baseId===t.id):[];
    if(t.airbase && G.phase!=='editor'){
      g.style.cursor='pointer';
      g.addEventListener('click',(e)=>{e.stopPropagation();openPopup('airbase',t.id,e);});
    }
    if(t.city){
      g.appendChild(el('circle',{cx:x,cy:y,r:15,fill:'#0d1117',stroke:col,'stroke-width':2}));
      g.appendChild(el('text',{x,y:y-2,'text-anchor':'middle','font-size':10,
        'font-weight':700,fill:col},t.id));
      g.appendChild(el('text',{x,y:y+9,'text-anchor':'middle','font-size':8,
        fill:t.hits?'#f85149':'#8b98a5'}, t.hits?`✸${t.hits}`:'—'));
    } else {
      const open=G.popup&&G.popup.kind==='airbase'&&G.popup.id===t.id;
      g.appendChild(el('rect',{x:x-15,y:y-15,width:30,height:30,rx:5,
        fill:t.dead?'#30363d':'#0d1117',stroke:open?'#58a6ff':col,
        'stroke-width':t.dead?1:(open?3:2),opacity:t.dead?.4:1}));
      g.appendChild(el('text',{x,y:y-2,'text-anchor':'middle','font-size':10,
        'font-weight':700,fill:t.dead?'#666':col},t.id));
      g.appendChild(el('text',{x,y:y+9,'text-anchor':'middle','font-size':8,
        fill:t.dead?'#666':'#8b98a5'}, t.dead?'✗':`${t.integRem}/${t.integ}`));
      // squadrons sitting on the deck — a small tally so you can see what is exposed
      if(based.length && !t.dead){
        const grounded=based.filter(a=>a.state!=='airborne').length;
        g.appendChild(el('circle',{cx:x+15,cy:y-15,r:7,
          fill:grounded?'#e6edf3':'#30363d',stroke:'#04121f','stroke-width':1}));
        g.appendChild(el('text',{x:x+15,y:y-12,'text-anchor':'middle','font-size':8,
          'font-weight':700,fill:grounded?'#04121f':'#8b98a5'},String(based.length)));
      }
    }
    svg.appendChild(g);
  }

  if(G.phase==='editor'){ return; }   // editor shows only terrain + targets
  // units
  for(const u of G.units){
    if(u.dead) continue;
    const {x,y}=hexCenter(u.col,u.row);
    const sel = (G.selUnit===u.uid)?'#58a6ff':'rgba(255,255,255,.35)';
    const g=el('g',{}); g.style.cursor='pointer';
    g.addEventListener('click',(e)=>{e.stopPropagation();onUnitClick(u);});
    const yy=y+(targetAt(u.col,u.row)?18:0);
    g.appendChild(el('circle',{cx:x,cy:yy,r:12,
      fill:u.color,stroke:sel,'stroke-width':G.selUnit===u.uid?3:1.5,opacity:.95}));
    if(u.sensor){                                   // radar: dish arcs instead of a magazine
      g.appendChild(el('path',{d:`M ${x-6} ${yy+4} A 7 7 0 0 1 ${x+6} ${yy+4}`,
        fill:'none',stroke:'#04121f','stroke-width':1.6}));
      g.appendChild(el('text',{x,y:yy-1,'text-anchor':'middle','font-size':7,
        'font-weight':700,fill:'#04121f'},'RDR'));
    } else {
      g.appendChild(el('text',{x,y:yy+1,'text-anchor':'middle','font-size':8,
        'font-weight':700,fill:'#04121f'},u.type==='SHORAD'?'SHR':u.type));
      g.appendChild(el('text',{x,y:yy+11,'text-anchor':'middle','font-size':8,
        fill:'#04121f'},String(u.kind==='ac'?u.ammo:u.mag)));
    }
    svg.appendChild(g);
  }
  // airborne squadrons, STACKED BY HEX like the contacts are
  const acStacks=new Map();
  for(const a of G.aircraft){
    if(a.dead||a.state!=='airborne'||a.col==null) continue;
    const k=a.col+','+a.row;
    if(!acStacks.has(k)) acStacks.set(k,{col:a.col,row:a.row,list:[]});
    acStacks.get(k).list.push(a);
  }
  for(const st of acStacks.values()){
    const {x,y}=hexCenter(st.col,st.row);
    const n=st.list.length;
    const lead=st.list.find(a=>a.uid===G.selUnit) || st.list[0];
    const sel=st.list.some(a=>a.uid===G.selUnit);
    const g=el('g',{}); g.style.cursor='pointer';
    g.addEventListener('click',(e)=>{e.stopPropagation();onAcStackClick(st.list);});
    if(n>1){
      const s=14;                                    // bigger chevron for a stacked flight
      svg.appendChild(el('circle',{cx:x,cy:y+1,r:16,fill:'none',stroke:lead.color,
        'stroke-width':1.3,'stroke-opacity':0.5,'pointer-events':'none'}));
      g.appendChild(el('polygon',{points:`${x},${y-s} ${x+s-1},${y+s-3} ${x-s+1},${y+s-3}`,
        fill:lead.color,stroke:sel?'#58a6ff':'#04121f','stroke-width':sel?3:1.5}));
      g.appendChild(el('text',{x,y:y+9,'text-anchor':'middle','font-size':11,'font-weight':700,
        fill:'#04121f'},String(n)));
    } else {
      g.appendChild(el('polygon',{points:`${x},${y-12} ${x+11},${y+9} ${x-11},${y+9}`,
        fill:lead.color,stroke:sel?'#58a6ff':'#04121f','stroke-width':sel?3:1.5}));
      g.appendChild(el('text',{x,y:y+7,'text-anchor':'middle','font-size':8,'font-weight':700,
        fill:'#04121f'},lead.type));
    }
    svg.appendChild(g);
  }
  // ---- threat tracks: this turn's flight path, fading with age (detected contacts only) ----
  for(const t of G.threats){
    if(t.type==='ballistic' || !isDetected(t)) continue;
    const tr=threatDisplayTrail(t); if(tr.length<2) continue;
    const pts=tr.map(p=>hexCenter(p.col,p.row));
    for(let i=1;i<pts.length;i++){
      const age=(pts.length-1-i)/Math.max(1,pts.length-1);       // 0 = newest
      svg.appendChild(el('line',{x1:pts[i-1].x,y1:pts[i-1].y,x2:pts[i].x,y2:pts[i].y,
        stroke:t.color,'stroke-width':2,'stroke-opacity':(0.75*(1-age)+0.12).toFixed(2),
        'stroke-linecap':'round','pointer-events':'none'}));
    }
    for(let i=0;i<pts.length-1;i++){                              // breadcrumb per past hex
      const age=(pts.length-1-i)/Math.max(1,pts.length-1);
      svg.appendChild(el('circle',{cx:pts[i].x,cy:pts[i].y,r:2,fill:t.color,
        opacity:(0.6*(1-age)+0.1).toFixed(2),'pointer-events':'none'}));
    }
  }
  // ballistic aimpoint markers
  for(const t of G.threats){
    if(t.type!=='ballistic' || !isDetected(t)) continue;
    const {x,y}=hexCenter(t.tcol,t.trow);
    const col=t.state==='window'?'#f85149':'#d29922';
    svg.appendChild(el('circle',{cx:x,cy:y,r:20,fill:'none',stroke:col,
      'stroke-width':2,'stroke-dasharray':'4 3',opacity:.9}));
    svg.appendChild(el('text',{x,y:y+27,'text-anchor':'middle','font-size':9,
      'font-weight':700,fill:col}, t.state==='window'?'⚑WINDOW':'⚑INBOUND'));
  }
  // Air-breathing contacts, STACKED BY HEX — several missiles sharing a hex draw one
  // marker showing how many, so a four-missile stack never reads as a single contact.
  const stacks=new Map();
  for(const t of G.threats){
    if(t.type==='ballistic' || !isDetected(t)) continue;
    const dp=threatDisplayPos(t);
    const k=dp.col+','+dp.row;
    if(!stacks.has(k)) stacks.set(k,{col:dp.col,row:dp.row,list:[]});
    stacks.get(k).list.push(t);
  }
  for(const st of stacks.values()){
    const {x,y}=hexCenter(st.col,st.row);
    const n=st.list.length;
    const lead=st.list.find(t=>t.tid===G.selThreat) || st.list[0];
    const sel=st.list.some(t=>t.tid===G.selThreat);
    const tracked=st.list.some(isTracked);          // any tracked ⇒ the stack is on the net
    const col=lead.color;
    // heading arrow for the lead contact
    const dtr=threatDisplayTrail(lead);
    const from = dtr.length>1 ? dtr[dtr.length-2] : lead.lastHex;
    if(from && !(from.col===st.col&&from.row===st.row)){
      const a=hexCenter(from.col,from.row);
      const vx=x-a.x, vy=y-a.y, L=Math.hypot(vx,vy)||1;
      const ux=vx/L, uy=vy/L, tipX=x+ux*19, tipY=y+uy*19;
      const px=-uy, py=ux;
      svg.appendChild(el('polygon',{points:
        `${tipX.toFixed(1)},${tipY.toFixed(1)} ${(tipX-ux*9+px*5).toFixed(1)},${(tipY-uy*9+py*5).toFixed(1)} `+
        `${(tipX-ux*9-px*5).toFixed(1)},${(tipY-uy*9-py*5).toFixed(1)}`,
        fill:col,opacity:0.95,'pointer-events':'none'}));
    }
    const g=el('g',{}); g.style.cursor='pointer';
    g.addEventListener('click',(e)=>{e.stopPropagation();onStackClick(st.list,e);});
    if(n>1){
      // a stacked contact is drawn bigger, ringed, and labelled with its count
      svg.appendChild(el('circle',{cx:x,cy:y,r:15,fill:'none',stroke:col,
        'stroke-width':1.3,'stroke-opacity':0.5,'pointer-events':'none'}));
      g.appendChild(el('polygon',{points:diamond(x,y,13),
        fill:tracked?col:'none', stroke:sel?'#58a6ff':(tracked?'#04121f':col),
        'stroke-width':sel?3:(tracked?1.5:2), 'stroke-dasharray':tracked?'':'3 2'}));
      g.appendChild(el('text',{x,y:y+4,'text-anchor':'middle','font-size':12,
        'font-weight':700,fill:tracked?'#04121f':col}, String(n)));
    } else {
      g.appendChild(el('polygon',{points:diamond(x,y,10),
        fill:tracked?col:'none', stroke:sel?'#58a6ff':(tracked?'#04121f':col),
        'stroke-width':sel?3:(tracked?1.5:2), 'stroke-dasharray':tracked?'':'3 2'}));
      g.appendChild(el('text',{x,y:y+3,'text-anchor':'middle','font-size':8,'font-weight':700,
        fill:tracked?'#04121f':col}, lead.type==='cruise'?'C':'D'));
    }
    svg.appendChild(g);
  }
}
// clicking a stack cycles through the contacts sharing that hex
/* One delegated listener instead of 900 fresh closures per render. The token groups (units,
   targets, flights, contact stacks) stopPropagation() on their own click, and every overlay
   drawn above the hexes carries pointer-events:none — so an event that reaches the SVG root
   is by definition a click on bare terrain. The layering falls out for free. */
(function wireBoard(){
  const svg=document.getElementById('board'); if(!svg) return;
  svg.addEventListener('click',e=>{
    const p=e.target.closest&&e.target.closest('[data-c]'); if(!p) return;
    onHexClick(+p.getAttribute('data-c'), +p.getAttribute('data-r'));
  });
})();

function onStackClick(list,ev){
  if(G.anim) return;
  if(G.phase==='engage' && G.selUnit!=null){ onThreatClick(list[0],ev); return; }
  const i=list.findIndex(t=>t.tid===G.selThreat);
  onThreatClick(list[(i+1)%list.length],ev);
}
// same for a stacked flight of squadrons
function onAcStackClick(list){
  if(G.anim) return;
  const i=list.findIndex(a=>a.uid===G.selUnit);
  onUnitClick(list[(i+1)%list.length]);
}
function diamond(x,y,s){ return `${x},${y-s} ${x+s},${y} ${x},${y+s} ${x-s},${y}`; }
function targetAt(c,r){ return G.targets.find(t=>t.col===c&&t.row===r&&!t.dead); }
// screen centre of a token / threat (matches the offsets used when drawing them)
function unitScreen(u){ const c=hexCenter(u.col,u.row);
  const off=(u.kind==='unit'&&targetAt(u.col,u.row))?18:0; return {x:c.x,y:c.y+off}; }
function threatScreen(t){ const p=t.type==='ballistic'?{col:t.tcol,row:t.trow}:{col:t.col,row:t.row};
  return hexCenter(p.col,p.row); }

// ---------- interactions ----------
function onHexClick(c,r){
  if(G.anim) return;                       // ignore clicks mid-animation
  if(G.phase==='editor'){ editorApply(c,r); return; }
  if(G.setupUnit){ moveSel({col:c,row:r}); return; }
  // clicking empty terrain dismisses the popup and clears the selection
  if(G.popup||G.selUnit!=null||G.selThreat!=null){
    G.popup=null; G.selUnit=null; G.selThreat=null; render();
  }
}

/* ================= MAP EDITOR ================= */
function enterEditor(){
  setPhase('editor'); G.editTool='sea'; G.editTarget=0;
  logMsg('info','Map editor — paint land/sea, place the 7 targets, set spawn edges, then Play or Export.');
  render();
}
function countTerrain(){ let land=0,sea=0; for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++)(G.terrain[c][r]?land++:sea++); return {land,sea}; }
function editorFill(toLand){                         // flood the whole board to sea or land
  for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++) G.terrain[c][r]=toLand;
  recomputeTerrainDerived(); render();
}
function editorReady(){                              // a playable map needs some of both
  const {land,sea}=countTerrain();
  if(land===0){ flash('Add some land first — targets & batteries need it.'); return false; }
  if(sea===0){ flash('Add some sea first — destroyers need water.'); return false; }
  return true;
}
function exitEditor(){ if(!editorReady())return; newGame(buildScenarioObject('custom','Edited map')); render(); }
function editorApply(c,r){
  if(G.editTool==='land'){ G.terrain[c][r]=true; recomputeTerrainDerived(); }
  else if(G.editTool==='sea'){ G.terrain[c][r]=false; recomputeTerrainDerived(); }
  else if(G.editTool==='target'){ const t=G.targets[G.editTarget]; if(t){ t.col=c; t.row=r; } }
  render();
}
function playEdited(){ if(!editorReady())return; newGame(buildScenarioObject('custom','Edited map')); render(); }
function exportScenario(){
  const o=buildScenarioObject('custom','My scenario');
  const terr=o.terrain.map(l=>'      '+JSON.stringify(l)).join(',\n');
  const tg=o.targets.map(t=>`      {id:'${t.id}', name:${JSON.stringify(t.name)}, col:${t.col}, row:${t.row}}`).join(',\n');
  const text=`  {\n    id:'custom', name:'My scenario',\n    briefing:'Custom map.',\n`+
    `    spawnEdges:${JSON.stringify(o.spawnEdges)},\n    terrain:[\n${terr}\n    ],\n    targets:[\n${tg}\n    ]\n  },`;
  document.getElementById('modalTitle').textContent='Export scenario';
  document.getElementById('modalBody').innerHTML=
    `<p class="muted">Copy this and paste it into the <b class="hl">SCENARIOS</b> array near the top of the file `+
    `(after the other scenarios) to make it a permanent, selectable map. Board is fixed at ${COLS}×${ROWS}.</p>`+
    `<textarea readonly style="width:100%;height:52vh;font:11px ui-monospace,Consolas,monospace;`+
    `background:#0a0e13;color:var(--ink);border:1px solid var(--edge);border-radius:6px;padding:8px">`+
    text.replace(/</g,'&lt;')+`</textarea>`;
  document.getElementById('modal').classList.add('on');
  setTimeout(()=>{const ta=document.querySelector('#modalBody textarea'); if(ta){ta.focus();ta.select();}},30);
}
function onUnitClick(u){
  if(G.anim) return;
  if(G.phase==='engage'){
    if(G.selThreat!=null){ const t=G.threats.find(x=>x.tid===G.selThreat);
      if(t) addShot(u,t); return; }
    G.selUnit=u.uid; render(); flash('now click a threat to assign a shot'); return;
  }
  if(G.phase==='move'||G.phase==='lull'){
    G.selUnit=u.uid;
    if(moveRemaining(u)>0){ startMove(u); return; }
    flash(moveBlockedMsg(u)); render(); return;
  }
  if(G.phase==='setup'){
    if(u.kind!=='ac'){G.setupUnit={mode:'setup',u};flash('click a hex to place '+u.name);render();}
  }
  G.selUnit=u.uid; render();
}
function onThreatClick(t,ev){
  if(G.anim) return;
  if(G.phase==='engage'){
    if(G.selUnit!=null){ const u=unitById(G.selUnit); if(u) addShot(u,t); return; }
    G.selThreat=t.tid;
    openPopup('threat',t.tid,ev);           // firing solution appears beside the contact
    return;
  }
  G.selThreat=t.tid; render();
}

// ================= SIDE PANEL =================
function renderSide(){
  document.getElementById('turnbox').textContent =
    G.phase==='setup'?'SETUP':
    G.inLull?`LULL ${G.lullTurn}`:`TURN ${G.turn} · Wave ${G.waveNum||'-'}`;

  // banner
  const banner=document.getElementById('banner'); banner.style.color='var(--ink)';
  banner.innerHTML = phaseHint();

  // toolbar
  renderToolbar();

  // stats
  const s=document.getElementById('statsSec');
  const vis=visibleThreats().length, hidden=G.threats.length-vis;
  s.innerHTML=`<p class="stitle">Situation</p>
   <div class="vpbig"><span class="k">Enemy VP</span>
     <span><span class="n" style="color:${bandColour()}">${G.enemyVP}</span>
     <span class="of">/ ${ceilingNow()}</span></span></div>
   <div class="vpbar"><div style="width:${Math.min(100,G.enemyVP/ceilingNow()*100)}%"></div></div>
   <div class="row" style="margin-top:7px"><span class="k">Projected result</span>
     <span class="band" style="color:${bandColour()};border:1px solid ${bandColour()}">${bandName()}</span></div>
   <div class="statgrid">
     <div class="row"><span class="k">Waves</span><span>${G.waveNum}/${maxWaves()}</span></div>
     <div class="row"><span class="k">Ballistics</span><span>${G.ballisticLaunched}/${ballisticCap()}</span></div>
     <div class="row"><span class="k">Contacts</span><span>${vis}${hidden>0?` <span style="color:var(--warn)">+${hidden}?</span>`:''}</span></div>
     <div class="row"><span class="k">Sensors</span><span>${sensors().length} <span class="k">(${radars().length} EWR)</span></span></div>
   </div>
   <div class="row" style="margin-top:9px;padding-top:7px;border-top:1px solid var(--edge)">
     <span class="k">Reserve</span>
     <span class="mag">ABM ${G.reserve.ABM} · SAM ${G.reserve.SAM} · SHR ${G.reserve.SHORAD}</span></div>`;

  renderDyn();
  renderForces();

}

function phaseHint(){
  switch(G.phase){
    case 'setup': return '<b>SETUP</b> · Buy your force, load magazines, position units — then Start.';
    case 'move':  return '<b>MOVEMENT</b> · Manoeuvre ships &amp; airborne squadrons. Batteries are emplaced until a lull.';
    case 'engage':return '<b>ENGAGEMENT</b> · Click a threat, assign every shot, <i>then</i> Resolve. No changing your mind after a die.';
    case 'resolved': return '<b>IMPACT RESOLVED</b> · Anything that got through has scored. Advance to the next turn.';
    case 'lull':  return '<b>LULL</b> · One action per unit — reload, relocate or rearm. The next wave can arrive without warning.';
    case 'editor':return '<b>MAP EDITOR</b> · Paint terrain, place targets, set spawn edges, then Play or Export.';
    case 'over':  return '<b>CAMPAIGN COMPLETE</b> · Your result is above.';
    default: return '';
  }
}

function renderToolbar(){
  const tb=document.getElementById('toolbar'); tb.innerHTML='';
  const rowA=document.createElement('div'); rowA.className='tbar';   // what to do now
  const rowB=document.createElement('div'); rowB.className='tbar';   // what to look at
  tb.appendChild(rowA); tb.appendChild(rowB);
  const btn=(row,label,cls,fn,dis)=>{const b=document.createElement('button');
    b.textContent=label;if(cls)b.className=cls;b.disabled=!!dis;
    b.onclick=fn;row.appendChild(b);return b;};

  // ---- row A: the action for this phase, then secondary actions ----
  if(G.phase==='setup'){
    btn(rowA,'▶ Start campaign','primary',startGame);
    btn(rowA,'Auto-load',null,()=>{autoLoad();render();});
  }
  else if(G.phase==='over'){
    btn(rowA,'📊 After-action','primary',openAAR);
    btn(rowA,'↻ New campaign',null,()=>{newGame();render();});
  }
  else if(G.phase==='move'){
    btn(rowA,'→ Engagement','primary',toEngage);
    btn(rowA,'↶ Undo move',null,undoMove,!(G.moveUndo&&G.moveUndo.length));
  }
  else if(G.phase==='engage'){
    btn(rowA,'⚔ Resolve shots','primary',resolveEngagement);
    btn(rowA,'Clear',null,()=>{G.alloc=[];render();});
  }
  else if(G.phase==='resolved') btn(rowA,'▶ Next turn','primary',()=>beginCombatTurn(false));
  else if(G.phase==='lull'){
    btn(rowA,'End lull turn ▶','primary',endLullTurn);
    btn(rowA,'↶ Undo move',null,undoMove,!(G.moveUndo&&G.moveUndo.length));
  }
  if(G.phase!=='editor'){
    btn(rowA,'📋 Briefing',null,openBriefing);
    btn(rowA,'❔ Rules',null,openHelp);
    btn(rowA,'↺ Reset',null,()=>{
      if(G.phase==='setup'||confirm('Restart campaign?')){newGame();render();}});
  }

  // ---- row B: coverage overlays ----
  if(G.phase!=='editor'){
    const lab=document.createElement('span'); lab.className='lbl'; lab.textContent='Coverage';
    rowB.appendChild(lab);
    for(const key of ['radar','cruise','abm']){
      const L=COVERAGE_LAYERS[key], on=G.layers&&G.layers[key];
      const b=btn(rowB,(on?'◉ ':'○ ')+L.label,'tog',()=>{ G.layers[key]=!G.layers[key]; render(); });
      b.title=L.label+' coverage outline';
      if(on){ b.style.borderColor=L.colour; b.style.color=L.colour; }
    }
  }
}

function renderDyn(){
  const d=document.getElementById('dynSec');
  if(G.phase==='editor'){ d.innerHTML=editorPanel(); wireEditor(); return; }
  if(G.phase==='engage'){ d.innerHTML=engagePanel(); wireEngage(); return; }
  if(G.phase==='setup'){ d.innerHTML=setupPanel(); wireSetup(); return; }
  if(G.phase==='move'||G.phase==='lull'){ d.innerHTML=airPanel(); wireAir(); return; }
  if(G.threats.length){ d.innerHTML=threatList(false); return; }
  d.innerHTML='<p class="stitle">Threats</p><div class="hint">No active threats.</div>';
}

function wireEditor(){
  document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{G.editTool=b.dataset.tool;render();});
  document.querySelectorAll('[data-fill]').forEach(b=>b.onclick=()=>editorFill(b.dataset.fill==='land'));
  const sel=document.getElementById('edTgt'); if(sel) sel.onchange=()=>{G.editTarget=+sel.value;render();};
  document.querySelectorAll('[data-edge]').forEach(cb=>cb.onchange=()=>{
    const s=cb.dataset.edge; G.spawnEdges=(G.spawnEdges||[]).filter(x=>x!==s);
    if(cb.checked) G.spawnEdges.push(s); render();});
  document.getElementById('edPlay').onclick=playEdited;
  document.getElementById('edExport').onclick=exportScenario;
  document.getElementById('edExit').onclick=exitEditor;
}

function wireSetup(){
  const pick=document.getElementById('scnPick');
  if(pick) pick.onchange=()=>{ newGame(pick.value); render(); openBriefing(); };
  const rr=document.getElementById('scnReroll'); if(rr) rr.onclick=()=>{ newGame(G.scenarioId); render(); };
  const ed=document.getElementById('scnEdit');  if(ed) ed.onclick=enterEditor;
  const bp=document.getElementById('budgetPick');
  if(bp) bp.onchange=()=>{ G.budget=+bp.value; render(); };
  const wp=document.getElementById('wavePick');
  if(wp) wp.onchange=()=>{ G.maxWaves=+wp.value; rescaleAmmo(); render(); };
  const sd=document.getElementById('seadPick');
  if(sd) sd.onchange=()=>{ G.seadDoctrine=sd.value; render(); };
  // full re-entry rather than an in-place patch: the ladder feeds ammoScale -> DDG magazines
  // -> autoLoad, and patching one of those without the others desyncs them
  const dp=document.getElementById('diffPick');
  if(dp) dp.onchange=()=>{ G.diff=dp.value; G.seadDoctrine=null; newGame(G.scenarioId); render(); };
  document.querySelectorAll('[data-buy]').forEach(b=>{ b.onclick=()=>{
    if(b.dataset.buy==='+') buyUnit(b.dataset.t); else sellUnit(b.dataset.t); };});
  document.querySelectorAll('[data-am]').forEach(b=>{ b.onclick=()=>{
    buyAmmo(b.dataset.p, b.dataset.am==='+'?5:-5); };});
  const sf=document.getElementById('stdForce');  if(sf) sf.onclick=applyStandardForce;
  const cf=document.getElementById('clearForce'); if(cf) cf.onclick=clearForce;
  document.querySelectorAll('[data-mg]').forEach(b=>{
    b.onclick=()=>{const u=unitById(+b.dataset.u);const pool=u.pool;
      if(b.dataset.mg==='+'){ if(u.mag<UTYPE[u.type].mag&&G.reserve[pool]>0){u.mag++;G.reserve[pool]--;} }
      else { if(u.mag>0){u.mag--;G.reserve[pool]++;} }
      render();};
  });
}
function autoLoad(){
  // greedy fill by priority ABM->SAM->SHORAD
  for(const pool of ['ABM','SAM','SHORAD']){
    for(const u of G.units.filter(x=>x.pool===pool)){
      const need=UTYPE[u.type].mag-u.mag; const take=Math.min(need,G.reserve[pool]);
      u.mag+=take;G.reserve[pool]-=take;
    }
  }
}
