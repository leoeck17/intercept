function wireAir(){
  document.querySelectorAll('[data-ac]').forEach(b=>{ b.onclick=()=>{
    const a=unitById(+b.dataset.u);
    if(b.dataset.ac==='launch')launchAC(a);
    else if(b.dataset.ac==='recall')recallAC(a);
    else if(b.dataset.ac==='divert')divertAC(a);
    else if(b.dataset.ac==='rearm')lullRearm(a);
  };});
  document.querySelectorAll('[data-l]').forEach(b=>{ b.onclick=()=>{
    const u=unitById(+b.dataset.u);
    if(b.dataset.l==='reload')lullReload(u); else startMove(u);
  };});
}

function threatList(interactive){
  const vis=visibleThreats();
  const hidden=G.threats.length-vis.length;
  let h=`<p class="stitle">Contacts (${vis.length})</p>`;
  if(hidden>0) h+=`<div class="hint" style="color:var(--warn)">⚠ ${hidden} track${hidden===1?'':'s'} outside radar cover — undetected.</div>`;
  const sorted=[...vis].sort((a,b)=>{
    const da=a.type==='ballistic'?0:dist({col:a.col,row:a.row},nearestTarget(a));
    const db=b.type==='ballistic'?0:dist({col:b.col,row:b.row},nearestTarget(b));
    return da-db;});
  for(const t of sorted){
    if(t.type==='ballistic'){
      h+=`<div class="threat ballistic ${G.selThreat===t.tid?'sel':''}" data-th="${t.tid}">
        <b style="color:var(--bad)">⚑ Ballistic</b> — ${t.state}<br>
        <span class="k">→ ${t.desc||''} @ ${colLabel(t.tcol)}${t.trow+1}</span>
        ${t.state==='launched'?'<div class="hint">Tracking — no shot until window.</div>':''}
        ${engageTags(t)}</div>`;
      continue;
    }
    // fog: show the observed track (position + vector), never the enemy's aim point
    const hd=headingOf(t), known=targetKnown(t), tgt=targetById(t.targetId);
    const trk=isTracked(t);
    h+=`<div class="threat ${G.selThreat===t.tid?'sel':''}" data-th="${t.tid}">
      <b style="color:${t.color}">${t.name}</b> @ ${colLabel(t.col)}${t.row+1}
      <span class="k">· ${hd?'tracking '+hd:'acquiring'}</span>
      ${trk?'':'<div class="hint" style="color:var(--warn)">◇ pop-up contact — no radar track, organic range only</div>'}
      ${known&&tgt?`<div class="hint" style="color:var(--bad)">⚠ terminal — closing on ${tgt.name}</div>`
                 :`<div class="hint">aim point unknown</div>`}
      ${engageTags(t)}</div>`;
  }
  return h;
}
function nearestTarget(t){ const tgt=targetById(t.targetId); return tgt?{col:tgt.col,row:tgt.row}:{col:0,row:t.row}; }

function engageTags(t){
  if(G.phase!=='engage') return '';
  let tags='';
  const alloc=G.alloc.filter(a=>a.tid===t.tid);
  if(alloc.length){ tags+='<div class="alloc">';
    for(const a of alloc){ const u=unitById(a.uid);
      tags+=`<span class="tag" data-rm="${u.uid}:${t.tid}">${u.name}×${a.rounds} ✕</span>`; }
    tags+='</div>'; }
  return tags;
}

/* The fire-assignment box — the live d20 firing solution, which is how the combat odds get
   taught. Lives in a floating popup so it sits next to the contact you clicked instead of
   pushing the side panel around. */
function assignmentHTML(t){
  let h='';
  {
    {
      const elig=shooters().filter(u=>u.col!=null&&canEngage(u,t)).map(u=>({u,info:shotProfile(u,t)}))
                 .filter(x=>x.info).sort((a,b)=>a.info.need-b.info.need);
      const hd=headingOf(t);
      h+=`<div class="fsol"><span class="k">@ ${t.type==='ballistic'?colLabel(t.tcol)+(t.trow+1):colLabel(t.col)+(t.row+1)}${hd?' · tracking '+hd:''}</span>`;
      // several contacts sharing this hex → let the player pick which one to shoot at
      if(t.type!=='ballistic'){
        const mates=G.threats.filter(x=>x.type!=='ballistic'&&isDetected(x)
                       &&x.col===t.col&&x.row===t.row);
        if(mates.length>1){
          h+=`<div class="frow" style="margin-top:5px"><span class="k">${mates.length} in this hex — target</span>
              <span class="step">`+
            mates.map((m,i)=>{
              const r=G.alloc.filter(a=>a.tid===m.tid).reduce((s,a)=>s+a.rounds,0);
              const on=m.tid===t.tid;
              return `<button data-pick="${m.tid}" class="${on?'primary':''}"
                       title="${r} round${r===1?'':'s'} assigned">${i+1}${r?'·'+r:''}</button>`;
            }).join('')+`</span></div>`;
        }
      }
      if(elig.length){
        let miss=1;                                   // cumulative P(kill) over committed rounds
        for(const {u,info} of elig){
          const n=(allocPair(u.uid,t.tid)||{rounds:0}).rounds;
          for(let i=0;i<n;i++) miss*=(1-info.pct/100);
        }
        const pk=Math.round((1-miss)*100);
        const totalRounds=G.alloc.filter(a=>a.tid===t.tid).reduce((s,a)=>s+a.rounds,0);
        for(const {u,info} of elig){
          const n=(allocPair(u.uid,t.tid)||{rounds:0}).rounds;
          const shotsLeft=shotsCap(u)-allocFor(u.uid), ammo=ammoLeft(u)-allocatedAmmo(u);
          const canAdd=shotsLeft>0&&ammo>0;
          const dry = ammo<=0;
          h+=`<div class="frow" style="align-items:flex-start${dry?';opacity:.5':''}">
            <span style="flex:1">
              <div><b>${u.name}</b> <span class="pct" style="color:${info.pct>=60?'var(--good)':info.pct>=40?'var(--warn)':'var(--bad)'}">${info.need}+ ~${info.pct}%</span></div>
              <div class="k" style="font-size:10.5px">r${info.rng} · ${shotsLeft}/${shotsCap(u)} shots · ${dry?'<span style="color:var(--bad)">no rounds</span>':ammo+' rds'}${info.notes.length?'<br>'+info.notes.join(' · '):''}</div>
            </span>
            <span class="step" style="margin-top:2px">
              <button data-as="-" data-u="${u.uid}" data-t="${t.tid}" ${n?'':'disabled'}>−</button>
              <b style="min-width:14px;text-align:center;display:inline-block">${n}</b>
              <button data-as="+" data-u="${u.uid}" data-t="${t.tid}" ${canAdd?'':'disabled'}>＋</button>
            </span></div>`;
        }
        h+=`<div class="frow" style="border-top:1px solid var(--edge);margin-top:5px;padding-top:5px">
              <b>${totalRounds} round${totalRounds===1?'':'s'} committed</b>
              <b style="color:${pk>=80?'var(--good)':pk>=50?'var(--warn)':'var(--bad)'}">P(kill) ~${pk}%</b></div>`;
        h+=`<div class="tip">Each round is a separate d20 — stack rounds to raise P(kill). Anything not killed impacts.</div>`;
      } else {
        h+=`<div class="frow k">No unit can engage this — it will leak.</div>`;
        if(t.type==='ballistic') h+=`<div class="tip">Ballistics only fall to an ABM battery or BMD destroyer within range 4 of the target hex.</div>`;
      }
      h+=`</div>`;
    }
  }
  return h;
}
function engagePanel(){
  let h=`<p class="stitle">Engagement — commit, then resolve</p>
   <div class="hint">Click a contact to open its firing solution, assign every shot, then Resolve.
   Overkill wastes rounds; underkill leaks.</div>`;
  h+=threatList(true);
  if(G.selUnit!=null){ const u=unitById(G.selUnit);
    if(u) h+=`<div class="hint">Selected <b>${u.name}</b>: shots ${allocFor(u.uid)}/${u.shots}, ammo ${ammoLeft(u)-allocatedAmmo(u)} left, range ${unitRange(u)}.</div>`;}
  return h;
}
function wireEngage(){
  document.querySelectorAll('[data-pick]').forEach(b=>{ b.onclick=(e)=>{
    e.stopPropagation(); G.selThreat=+b.dataset.pick; render(); };});
  document.querySelectorAll('[data-as]').forEach(b=>{ b.onclick=(e)=>{
    e.stopPropagation();
    const u=unitById(+b.dataset.u), t=G.threats.find(x=>x.tid===+b.dataset.t);
    if(!u||!t) return;
    if(b.dataset.as==='+') addShot(u,t); else removeShot(u.uid,t.tid);
  };});
  document.querySelectorAll('[data-th]').forEach(dv=>{ dv.style.cursor='pointer';
    dv.onclick=(e)=>{ if(e.target.dataset.rm){const[uid,tid]=e.target.dataset.rm.split(':');removeShot(+uid,+tid);return;}
      const t=G.threats.find(x=>x.tid===+dv.dataset.th); if(t) onThreatClick(t,e); };});
}

function renderForces(){
  const f=document.getElementById('forceSec');
  let h=`<p class="stitle">Batteries, radars & ships</p>`;
  for(const u of G.units){
    const cls=u.dead?'unit dead':(G.selUnit===u.uid?'unit sel':'unit');
    const line = u.dead ? 'destroyed'
      : u.sensor ? `detection ${u.detect} · @${colLabel(u.col)}${u.row+1}`
      : `mag ${u.mag}/${UTYPE[u.type].mag} · r${u.range}${u.detect?' · radar '+u.detect:''} · @${colLabel(u.col)}${u.row+1}`;
    h+=`<div class="${cls}" data-u="${u.uid}">
      <span class="badge" style="background:${u.color};color:#04121f">${u.sensor?'RDR':(u.type==='SHORAD'?'SHR':u.type)}</span>
      <div style="flex:1"><div>${u.name}</div>
      <div class="k" style="font-size:11px">${line}</div></div>
      </div>`;
  }
  f.innerHTML=h;
  setTimeout(()=>{document.querySelectorAll('#forceSec [data-u]').forEach(dv=>{
    dv.onclick=()=>{const u=unitById(+dv.dataset.u); if(!u||u.dead)return; onUnitClick(u);};});},0);
}

/* Log size lives outside G so it survives a new campaign — it's a display preference,
   not game state. Restored from localStorage where available. */
let LOG_FONT=11, LOG_H=170;
try{ const s=JSON.parse(localStorage.getItem('intercept_log')||'null');
     if(s){ LOG_FONT=s.f||LOG_FONT; LOG_H=s.h||LOG_H; } }catch(_){}
function saveLogPrefs(){
  try{ localStorage.setItem('intercept_log',JSON.stringify({f:LOG_FONT,h:LOG_H})); }catch(_){}
}
function applyLogSize(){
  const l=document.getElementById('log'); if(!l) return;
  l.style.fontSize=LOG_FONT+'px';
  l.style.lineHeight=(LOG_FONT*1.45).toFixed(1)+'px';
  l.style.height=LOG_H+'px';
}
function renderLog(){
  const l=document.getElementById('log');
  const atBottom = l.scrollHeight-l.scrollTop-l.clientHeight < 24;
  l.innerHTML=G.log.slice(-160).map(e=>`<div class="l ${e.cls}">${e.txt}</div>`).join('');
  applyLogSize();
  if(atBottom) l.scrollTop=l.scrollHeight;      // don't yank the view if they scrolled up
}
// one-time wiring for the log's size controls
(function wireLog(){
  const hdr=document.getElementById('logHdr'); if(!hdr) return;
  const bump=d=>{ LOG_FONT=Math.max(9,Math.min(22,LOG_FONT+d)); saveLogPrefs(); applyLogSize(); };
  document.getElementById('logSmaller').onclick=e=>{e.stopPropagation();bump(-1);};
  document.getElementById('logBigger').onclick =e=>{e.stopPropagation();bump(+1);};
  // drag the header up/down to resize the log
  hdr.addEventListener('pointerdown',e=>{
    if(e.target.closest('button')) return;
    e.preventDefault();
    const y0=e.clientY, h0=LOG_H;
    hdr.classList.add('resizing');
    try{ hdr.setPointerCapture(e.pointerId); }catch(_){}
    const move=ev=>{ LOG_H=Math.max(60,Math.min(window.innerHeight-220, h0+(y0-ev.clientY)));
                     applyLogSize(); };
    const up=ev=>{ hdr.classList.remove('resizing'); saveLogPrefs();
      try{ hdr.releasePointerCapture(ev.pointerId); }catch(_){}
      hdr.removeEventListener('pointermove',move);
      hdr.removeEventListener('pointerup',up);
      hdr.removeEventListener('pointercancel',up); };
    hdr.addEventListener('pointermove',move);
    hdr.addEventListener('pointerup',up);
    hdr.addEventListener('pointercancel',up);
  });
})();

// ================= rules / help modal =================
const sw=c=>`<span class="swatch" style="background:${c}"></span>`;
function helpHTML(){
  return `
  <p class="muted">A solo air-defense wargame. You command the defenses; the computer is a dice-driven
  attacker. New here? Read the mission, then just start playing — the panel on the right always tells you
  what to do, and this window is on the <b class="hl">❔ Rules</b> button whenever you need it.</p>

  <h3>Your mission</h3>
  <p>Survive the <b class="hl">opening hours of a war</b>: three raids with lulls between them (a scenario or the
  setup panel may shorten this). You cannot win
  by scoring — you win by <b class="hl">holding the enemy's Victory Points (VP) down</b>. Every target the enemy
  damages earns them VP. Your result at the end:</p>
  <ul>
    <li><b class="hl">Decisive</b> ≤ 20 VP · <b class="hl">Solid</b> ≤ 35 · <b class="hl">Marginal</b> ≤ 55 · <b>Defeat</b> &gt; 55.</li>
    <li>If the enemy ever reaches <b class="hl">100 VP</b>, it's an immediate defeat.</li>
  </ul>

  <h3>The map</h3>
  <p>${sw('#22391e')} Your country is a compact island — roughly <b class="hl">15×15 hexes (about 750 km square,
  the size of Great Britain)</b>. ${sw('#12435c')} Everything else is sea: approach depth for the raid and room for
  early warning. Threats enter from the <b class="hl">sea edges</b> — always the east, sometimes the north and/or
  south — and fly toward a target. Each campaign generates a fresh coastline.</p>

  <h3>What you are defending</h3>
  <p>There are two kinds of target, and they behave completely differently.</p>
  <table class="rules"><tr><th>Target</th><th>VP/dmg</th><th>Integrity</th><th>Behaviour</th></tr>
    <tr><td>${sw('#8957e5')}Airbase</td><td>3 <span class="muted">+4</span></td><td>3</td><td rowspan="3"><b class="hl">Military installations</b> can be
      knocked out. Once integrity reaches zero they are wrecked — and stop scoring for the enemy for the rest of the war.
      The number after the <b>+</b> is a <b class="hl">write-off bonus</b> the enemy banks the moment the site falls:
      losing the node costs far more than the cratering that led up to it. There is one grade of airbase, so a map may
      field as many as its geography warrants.</td></tr>
    <tr><td>${sw('#8957e5')}Military HQ</td><td>3 <span class="muted">+3</span></td><td>2</td></tr>
    <tr><td>${sw('#8957e5')}Naval port</td><td>2 <span class="muted">+2</span></td><td>3</td></tr>
    <tr><td>${sw('#2f81f7')}Capital</td><td>2</td><td><b>—</b></td><td rowspan="2"><b class="hl">Cities cannot be destroyed.</b>
      No realistic number of cruise missiles razes a city, so they have no integrity and never fall off the map.
      <b>Every single strike scores</b>, for ever — a city that has been hit six times will score just as much on the
      seventh. The only way to stop a city bleeding VP is to shoot the missile down.</td></tr>
    <tr><td>${sw('#2f81f7')}Three other cities</td><td>1</td><td><b>—</b></td></tr>
  </table>
  <p>That asymmetry drives the whole campaign. Military sites are a <b class="hl">finite</b> loss: let the forward
  airbase go and the enemy can never score from it again. Cities are a <b class="hl">permanent</b> liability that
  keeps costing you every time a leaker gets through — but there are four of them and you cannot cover them all.
  Deciding what to write off is the game.</p>

  <h3>What is coming at you</h3>
  <table class="rules"><tr><th>Weapon</th><th>Glyph</th><th>Speed</th><th>Damage</th><th>Behaviour</th></tr>
    <tr><td>${sw('#f0883e')}Cruise missile</td><td><b>C</b></td><td>3 hex/turn</td><td>2</td>
      <td>The main effort. Flies low — <b class="hl">−3</b> to hit it at range 3+. Enters from a sea edge.</td></tr>
    <tr><td>${sw('#db6d28')}Attack drone</td><td><b>D</b></td><td>1 hex/turn</td><td>1</td>
      <td>Launched from the water close in, not from the edge. Slow, easy to hit, cheap to let through.</td></tr>
    <tr><td>${sw('#f85149')}Ballistic missile</td><td><b>⚑</b></td><td>—</td><td>3</td>
      <td>Arrives on coordinates. Only an ABM battery or a BMD destroyer within range 4 can touch it.</td></tr>
  </table>
  <p><b class="hl">Drones are how the enemy makes you spend.</b> At one hex a turn a drone sits inside a SAM
  envelope for four consecutive turns, offering — and demanding — a shot on every one of them. They launch from
  <i>inside</i> your radar cover, so unlike cruise they are the threat you always see. Big, slow and unmissable.</p>
  <p class="tip">The correct answer is frequently to <b class="hl">let them through</b>. A drone does 1 damage and
  is worth 1 point to the enemy — often less than the round it would take to stop it. Every drone you shoot at is
  a round not available for the cruise missile behind it. That call, made under a clock, is the point of them.</p>

  <h3>Your forces</h3>
  <table class="rules"><tr><th>Unit</th><th>Range</th><th>Shots/turn</th><th>Notes</th></tr>
    <tr><td>${sw('#8957e5')}ABM battery ×2</td><td>4</td><td>1</td><td>Only unit (with the destroyer) that can kill <b>ballistic</b> missiles</td></tr>
    <tr><td>${sw('#2f81f7')}SAM battery ×3</td><td>3</td><td>2</td><td>Your anti-cruise workhorse</td></tr>
    <tr><td>${sw('#3fb950')}SHORAD ×2</td><td>1</td><td>3</td><td>Short range, cheap, deadly up close</td></tr>
    <tr><td>${sw('#e3b341')}Radar ×2</td><td>detect 10</td><td>—</td><td>Unarmed. The network's eyes — see below</td></tr>
    <tr><td>${sw('#39c5cf')}Destroyer ×2</td><td>4 · detect 6</td><td>3</td><td>At sea; <b>never reloads</b>. Its own SPY radar makes it a mobile picket</td></tr>
    <tr><td>${sw('#e6edf3')}5th-gen ×1</td><td>3 · detect 7</td><td>2</td><td>The sensor: move 5, cues <b>+3</b>, 4 turns on station, only 4 weapons</td></tr>
    <tr><td>${sw('#c9d1d9')}4th-gen ×2</td><td>2 · detect 3</td><td>3</td><td>The shooter: move 4, 6 weapons, 4 sorties, but short-sighted (hits on 10)</td></tr>
  </table>
  <p><b class="hl">The two fighters are different tools, not two grades of the same jet.</b> The 5th-gen sees furthest,
  reaches furthest and makes every other unit shoot better, but carries almost nothing. The 4th-gen carries and fires
  far more and regenerates sorties faster, yet hits on 10 and can barely see — it is at its best inside the 5th-gen's
  cue and a radar's track.</p>
  <h3>Procurement — build your own force</h3>
  <p>At setup you spend a <b class="hl">budget</b> (Lean 1000 · Standard 1350 · Reinforced 1750 · Lavish 2200) on
  platforms and ammunition. Platforms are a one-off cost; ammunition is bought into the national reserve and then
  distributed into magazines.</p>
  <table class="rules"><tr><th>Platform</th><th>pts</th><th>Round</th><th>pts each</th></tr>
    <tr><td>SHORAD</td><td>10</td><td>SHORAD</td><td>1</td></tr>
    <tr><td>SAM battery</td><td>25</td><td>SAM</td><td>3</td></tr>
    <tr><td>Radar (EWR)</td><td>30</td><td>ABM</td><td>8</td></tr>
    <tr><td>4th-gen squadron</td><td>35</td><td colspan="2" class="muted">Ship rounds and aircraft weapons are included in the platform</td></tr>
    <tr><td>ABM battery</td><td>40</td><td colspan="2"></td></tr>
    <tr><td>5th-gen squadron</td><td>55</td><td colspan="2"></td></tr>
    <tr><td>Destroyer</td><td>60</td><td colspan="2"></td></tr>
  </table>
  <p>This is where your strategy is decided. A wall of cheap SHORAD sees almost nothing but is dense over what it
  covers; a pair of destroyers gives you mobile radar and 24 rounds that can never be replaced; ABM rounds cost eight
  times a SHORAD round, so every ballistic you plan to stop is a battery you did not buy. <b class="hl">Eyes or shooters,
  launchers or magazines</b> — you cannot have all of it.</p>
  <p><b class="hl">Interceptors are scarce and finite.</b> Whatever reserve you buy never refills — it's all you get for
  the whole war. Magazines load from it at setup; the remainder funds lull reloads. Hoard your ABM rounds.</p>

  <h3>A turn (15 min of war)</h3>
  <ol>
    <li><b class="hl">Generation</b> — a wave may arrive; a ballistic-missile "drip" is rolled.</li>
    <li><b class="hl">Movement</b> — threats advance; you manoeuvre destroyers (1 sea hex) &amp; airborne squadrons (4). <b>Batteries are emplaced and cannot move during a raid</b> — they relocate only in a lull, 1 hex (~50 km).</li>
    <li><b class="hl">Engagement</b> — the heart of the game: <b>commit every shot before rolling</b> (see below).</li>
    <li><b class="hl">Impact</b> — any threat that reached its target hits and scores the enemy VP.</li>
    <li><b class="hl">Cleanup</b> — wrecks removed; when a wave is spent, a lull begins.</li>
  </ol>

  <h3>Radar — you cannot shoot what you cannot see</h3>
  <p>Your two radars are <b class="hl">unarmed sensors with detection range 10</b>. The amber wash on the map is the
  volume they hold. Everything else follows from it:</p>
  <ul>
    <li><b class="hl">Tracked</b> — a threat inside radar cover is a solid contact: shown with its vector, and engageable
    by <b>any</b> unit within weapons range.</li>
    <li><b class="hl">Undetected</b> — outside radar cover a threat is <b>not on your map at all</b>. It is still flying.</li>
    <li><b class="hl">Pop-up contact</b> — a unit's own organic sensor reaches <b>1 hex</b>. An undetected missile that
    strays that close appears as a hollow dashed marker and may be engaged, but <b>only at range 1</b> — a
    last-ditch self-defence shot. Your long-range batteries are worth nothing without a track.</li>
    <li><b class="hl">Ballistic missiles are always detected</b> — the launch itself is observed, so the ABM
    coverage puzzle is unaffected.</li>
  </ul>
  <p><b class="hl">Radars are not the only eyes.</b> Destroyers carry their own radar (<b>detect 6</b>) and an airborne
  5th-gen is a flying sensor node (<b>detect 7</b>); a 4th-gen manages only <b>3</b>. Altitude beats power against
  low-flying cruise missiles, so pushing the 5th-gen forward can open a corridor of tracks no ground radar reaches —
  and a destroyer steaming out as a <b>radar picket</b> is often worth more than its magazine.</p>
  <p>Radars relocate like batteries: <b>only during a lull, 1 hex</b>, as that unit's one action. Push them forward for
  depth of warning and they are exposed; hold them back and missiles cross your map unseen.</p>
  <p><b style="color:var(--bad)">The enemy may know this.</b> Under <b class="hl">counter-sensor</b> doctrine, ballistic
  SEAD hunts <b class="hl">radars first</b>, ahead of ABM, SAM and SHORAD — lose your radar picture and the whole defence
  collapses to a ring of 1-hex self-defence bubbles without a single launcher being destroyed. Under
  <b class="hl">counter-battery</b> doctrine the radars are spared and the launchers are hunted instead. You choose which
  enemy you face at setup. Either way, relocating the threatened unit between waves is often worth more than another
  magazine. <span class="muted">This campaign: <b class="hl">${doctrine().name}</b>.</span></p>

  <h3>Jamming — not everything on the scope is real</h3>
  <p>The enemy flies <b class="hl">OECM</b> alongside the raid: offensive electronic countermeasures that paint
  <b class="hl">false tracks</b> onto your radar. These are not decoy airframes. There is no object out there at all —
  which is why nothing distinguishes a ghost from a real cruise missile. Same glyph, same colour, same heading, same
  hidden aim point, same firing solution and the same odds in the popup. Typically about
  <b class="hl">a quarter</b> of what you see is jamming, but you are never told the number for a given wave.</p>
  <p>What beats a jammer is not a better guess, it is <b class="hl">burn-through</b>: get a real sensor close enough and
  the true return overwhelms the jamming, and the track resolves as false. That is a range, and it depends on the sensor:</p>
  <table class="rules"><tr><th>Sensor</th><th>Burn-through</th><th></th></tr>
    <tr><td>${sw('#e6edf3')}Airborne 5th-gen</td><td><b>${BURN.F5} hexes</b></td><td>Fusion — the best discriminator you own</td></tr>
    <tr><td>${sw('#e3b341')}Radar (EWR)</td><td><b>${BURN.RADAR} hex</b></td><td>Adjacent only</td></tr>
    <tr><td>Any other unit</td><td><b>same hex</b></td><td>Organic sensor — only if it flies directly overhead</td></tr>
  </table>
  <p>Those ranges are <b class="hl">shorter than the ranges you shoot at</b>, and that is the whole tension: a SAM
  reaches 3 hexes but cannot tell you what it is looking at until the track is almost on top of it. Roughly a third of
  the jamming survives long enough to draw fire.</p>
  <p>Burn-through is checked <b class="hl">after you move as well as after the enemy does</b>, so pushing a fighter at a
  suspicious contact pays off on the turn you spend the move. Any rounds already committed to a track that turns out to
  be a ghost are <b class="hl">handed straight back</b> — you lose nothing but the move.</p>
  <p>Otherwise you find out the hard way. A round that <i>would</i> have killed it reports <b class="hl">no intercept</b>:
  the seeker arrived and found empty air. And a ghost never engaged simply fades when it reaches its notional aim point.</p>
  <p class="tip">Ghosts fly <b>on top of</b> the raid, not instead of part of it — jamming never means fewer real missiles.
  It costs you rounds, and it costs you the turns you spend watching something that was never there.</p>

  <h3>Reading the raid (what you can actually see)</h3>
  <p>Your radar shows <b class="hl">where a missile is and where it is heading</b> — not what it is aimed at. Each track
  draws a fading trail of the path it has flown plus an arrow for its current vector; the threat list reports its bearing
  ("tracking SW") and <b>aim point unknown</b>. Only in the <b class="hl">terminal phase</b> (within 2 hexes) does the target
  become obvious, and by then you may be out of shots. Read the vectors, guess the raid's intent, and commit early.</p>

  <h3>Shooting: commit, then roll</h3>
  <p>Click a threat to open the <b class="hl">assignment window</b>: every unit that can engage it, its to-hit number and odds,
  and <b>＋ / −</b> buttons to stack rounds. A running <b class="hl">P(kill)</b> shows the combined chance across everything you
  have committed. Assign all your shots, <b>then</b> press Resolve — you cannot change your mind after seeing a die, so
  a low-percentage shot is a real gamble. Double up on the leakers that matter.</p>
  <p>To hit, a unit rolls <b class="hl">d20 ≥ its target number</b>. Modifiers: <b class="hl">+3</b> when a 5th-gen aircraft cues the shot;
  <b class="hl">−3</b> against a cruise missile at range 3+ (they fly low); <b class="hl">−2</b> for a transit shot (below).
  A hit destroys the threat; a miss still spends the round.</p>
  <p><b class="hl">Engage on transit:</b> you may also fire at a missile that <i>flew through</i> your envelope this turn, not just one
  that ended its move inside it — a fleeting shot at −2. Watch the tracks: a missile crossing a battery's reach is engageable
  even though it kept going.</p>

  <h3>Aircraft: sorties &amp; endurance</h3>
  <ul>
    <li>Each squadron has <b class="hl">3 sorties</b>. <b>Launching spends one.</b></li>
    <li>A sortie lasts <b class="hl">${'4'} turns on station</b> (~1 hour); at bingo fuel it returns automatically.</li>
    <li>Recovering takes a turn on the ground; then it can rearm (free, in a lull) and launch again.</li>
    <li>So the 5th-gen's <b>+3 cue</b> is a scarce, timed asset — spend it on the waves that matter, not turn 1.</li>
    <li><b style="color:var(--bad)">Caught on the ground:</b> when a strike lands on a live airbase, every squadron
    sitting there rolls d6 and is <b>destroyed on a 1</b>. If the airbase is knocked out entirely, everything still on
    it is lost outright. Dispersal is the answer — a squadron in the air cannot be cratered.</li>
    <li><b class="hl">Diversion:</b> a squadron that is <i>airborne</i> when its airfield falls <b>diverts to the
    nearest surviving airbase</b> instead of being lost. You can also redeploy a grounded squadron yourself with
    <b class="hl">⇢ Base</b>, which cycles it to the next airfield — it is in transit for a turn, so moving out ahead of
    a raid costs you a turn of cover.</li>
    <li><b style="color:var(--bad)">Squadrons are worth VP to the enemy:</b> <b>5</b> for a 5th-gen, <b>3</b> for a
    4th-gen, however they are lost. Air power is not free to spend.</li>
  </ul>

  <h3>Ballistic missiles ⚑</h3>
  <p>Every turn there's a small chance one launches (max 6 all game). It works on a timer:</p>
  <ul>
    <li><b class="hl">Launch turn</b> — a marker appears on its target hex. You can only track it, not shoot.</li>
    <li><b class="hl">Next turn (window)</b> — it can be engaged, but <b>only</b> by an ABM battery or BMD destroyer within
    <b>range 4 of the aimpoint</b>. Both reach the same distance; they differ in the roll — <b>ABM hits on 13+, a
    destroyer on 14+</b> — so a warship on the right station is a real, if thin, ballistic defence. No coverage in
    reach = it hits. This is a placement puzzle: you cannot cover everything.</li>
  </ul>
  <p>Two-thirds of ballistic fire hunts your <b class="hl">airbases and defences</b> — a hit destroys the unit outright.
  What it goes after depends on the doctrine you selected at setup:</p>
  <ul>
    <li><b class="hl">Counter-battery</b> — launchers only, heaviest first: ABM, then SAM, then SHORAD.
      Radars are spared; the enemy is spending these on your shooters, not your eyes.</li>
    <li><b class="hl">Counter-sensor</b> — <b class="hl">radars first</b>, then the launchers. Cheaper: a blinded
      battery is cut to a one-hex self-defence bubble without being destroyed at all.</li>
  </ul>
  <p>Within whichever tier is top, the aim point is picked <b class="hl">at random</b> — you cannot predict which of your
  radars or ABM batteries draws the missile. But it is aimed at <b class="hl">coordinates</b>, not at the unit: anything
  that relocated during the lull is simply not there when it lands. That is the counter, and it is the same under both
  doctrines. <span class="muted">This campaign: <b class="hl">${doctrine().name}</b>.</span></p>

  <h3>The lull (between waves)</h3>
  <p>Breathing room — but it can end without warning. Each unit gets <b class="hl">one action</b> per lull turn:</p>
  <ul>
    <li><b class="hl">Reload</b> a land battery from the reserve · <b class="hl">Relocate</b> a battery 1 hex · <b class="hl">Rearm</b> a squadron at an airbase.</li>
    <li>Destroyers can't reload — ever. Ships and airborne squadrons still move freely.</li>
  </ul>
  <p>Lull turn 1 is always safe. From turn 2 on, the next wave may arrive that very turn, and the odds widen each turn you linger.
  Reload first or reposition first — that's the bet.</p>

  <h3>Controls</h3>
  <ul>
    <li><b>Click a unit</b> (map or list) → see its firing range shaded on the map.</li>
    <li><b>Click a threat</b> → eligible interceptors glow green with lines to it, and a firing solution appears.</li>
    <li>In Engagement, click a threat then a unit (or unit then threat) to assign a shot; click a tag to remove it.</li>
    <li><b>Click empty water/land</b> to clear the selection.</li>
    <li><b class="hl">◉ Radar / ◉ Cruise / ◉ ABM</b> in the toolbar toggle a coverage outline for each envelope —
    <b>amber</b> for detection (radars, destroyers, airborne squadrons); <b>blue</b> for anti-cruise fire, covering
    <i>every</i> unit that can shoot a cruise missile (ABM, SAM, SHORAD, destroyers and airborne squadrons);
    <b>purple</b> for the ballistic umbrella (ABM batteries and BMD destroyers). Each draws one line around the
    <b>combined</b> area, so overlapping units merge into a single envelope and you can see your gaps at a glance.</li>
    <li>Grey-shaded ground is <b class="hl">neutral territory</b> — you may not deploy or move onto it.</li>
  </ul>
  <p class="muted" style="margin-top:14px">Numbers are a provisional design draft (rules v0.7). Have fun holding the line.</p>`;
}
function openHelp(){ const m=document.getElementById('modal');
  document.getElementById('modalTitle').textContent='INTERCEPT — How to play';
  document.getElementById('modalBody').innerHTML=helpHTML();
  document.getElementById('modalBody').scrollTop=0;
  m.classList.add('on'); }

/* ---------- the short version: what a player needs before turn 1 ---------- */
function briefingHTML(){
  const scn=SCENARIOS.find(s=>s.id===G.scenarioId);
  const lead=G.briefing || 'A freshly generated coastline — your country is the island; everything else is the approach.';
  const cnt={};
  G.units.forEach(u=>cnt[u.type]=(cnt[u.type]||0)+1);
  G.aircraft.forEach(a=>cnt[a.type]=(cnt[a.type]||0)+1);
  const LBL={ABM:'ABM battery',SAM:'SAM battery',SHORAD:'SHORAD',RADAR:'Radar',
             DDG:'Destroyer',F5:'5th-gen sqn',F4:'4th-gen sqn'};
  const oob=['RADAR','ABM','SAM','SHORAD','DDG','F5','F4'].filter(k=>cnt[k])
    .map(k=>`<span><b>${cnt[k]}×</b> ${LBL[k]}</span>`).join('');
  const mil=G.targets.filter(t=>!t.city).length, cit=G.targets.filter(t=>t.city).length;
  const bandChip=([n,c])=>`<span style="color:${bandColour(c)};border-color:${bandColour(c)}">${n} ≤ ${c}</span>`;
  return `<div class="brief">
    <p class="lead">${lead}</p>

    <h4>Your mission</h4>
    <p>You cannot win by scoring — only by <b class="hl">holding the enemy's score down</b> across
    ${maxWaves()===1?'a single raid':maxWaves()+' raids'}.
    Every target they damage earns them VP.</p>
    <div class="bands">${bandBar().map(bandChip).join('')}
      <span style="color:var(--bad);border-color:var(--bad)">Defeat &gt; ${bandBar()[bandBar().length-1][1]}</span></div>

    <h4>What you have</h4>
    <div class="oob">${oob}</div>

    <h4>What you are defending</h4>
    <p><b class="hl">${mil} military installations</b> — these can be knocked out, and once wrecked they stop
    scoring for the enemy for good. <b class="hl">${cit} cities</b> — these can <b>never</b> be destroyed, so every
    single strike on one scores, for ever. That asymmetry is the whole campaign.</p>

    <h4>The five things that matter</h4>
    <ol>
      <li><b class="hl">Commit before you roll.</b> Assign every shot, then Resolve. You cannot change your mind
      after seeing a die.</li>
      <li><b class="hl">You cannot shoot what you cannot see.</b> The amber outline is radar cover. Outside it a
      missile is invisible and your batteries are cut to a 1-hex self-defence bubble.</li>
      <li><b class="hl">Interceptors are finite.</b> The national reserve never refills — what you spend is gone.</li>
      <li><b class="hl">Batteries are emplaced.</b> They only relocate during a lull, one hex. Ships and aircraft
      manoeuvre every turn.</li>
      <li><b class="hl">Ballistics need coverage, not luck.</b> Only an ABM battery or a destroyer within 4 hexes of
      the aimpoint can engage one — and you get a single turn's warning.</li>
    </ol>

    <p class="muted" style="margin-top:16px">Everything else is explained in <b>❔ Rules</b>, which is always in
    the toolbar. You can also reopen this briefing any time with <b>📋 Briefing</b>.</p>
    <div class="step" style="margin-top:14px">
      <button class="primary" id="brBegin">Begin</button>
      <button id="brFull">❔ Full rules</button>
    </div></div>`;
}
/* ================= AFTER-ACTION REPORT ================= */
// Cost-Exchange values from the ruleset's module
const ROUND_COST={ABM:8, SAM:3, SHORAD:1, DDG:3, AAM:2};
const LEAK_VALUE={cruise:4, ballistic:10, drone:1};
function aarNumbers(){
  const S=G.stats;
  const spend=Object.keys(ROUND_COST).reduce((s,k)=>s+(S.rounds[k]||0)*ROUND_COST[k],0);
  const fired=Object.values(S.rounds).reduce((a,b)=>a+b,0);
  const kills=S.cruiseKilled+S.droneKilled+S.ballKilled;
  const leakVal=S.cruiseLeaked*LEAK_VALUE.cruise + S.droneLeaked*LEAK_VALUE.drone
              + S.ballHit*LEAK_VALUE.ballistic;
  const unspent=G.units.reduce((s,u)=>s+(u.dead?0:u.mag),0)
              + G.reserve.ABM+G.reserve.SAM+G.reserve.SHORAD;
  // what the jamming cost: rounds into ghosts, priced at the average round actually fired
  const ghostSpend = fired ? Math.round(S.ghostRounds*(spend/fired)) : 0;
  return {spend, fired, kills, leakVal, unspent, ghostSpend,
    ghostBurnRate: S.ghostSpawned? S.ghostBurned/S.ghostSpawned : 0,
    cruiseRate: S.cruiseSpawned? S.cruiseKilled/S.cruiseSpawned : 0,
    droneRate: S.droneSpawned? S.droneKilled/S.droneSpawned : 0,
    ballRate: G.ballisticLaunched? S.ballKilled/G.ballisticLaunched : 0,
    perKill: kills? spend/kills : 0};
}
/* A commander's assessment, written from what actually happened rather than a template. */
function evaluationHTML(){
  const S=G.stats, N=aarNumbers(), band=bandName();
  const pc=x=>Math.round(x*100);
  const out=[];

  // --- verdict
  const verdict={
    Decisive:'A decisive defence. The raid was broken up before it could do meaningful harm.',
    Solid:'A solid defence. The enemy paid for what they took, and the country came through in working order.',
    Marginal:'A marginal result. You held, but only just — another wave of that weight would have broken the line.',
    Defeat:'A defeat. The defence was penetrated repeatedly and the enemy achieved what they came for.'
  }[band];
  out.push(`<p><b class="hl">${verdict}</b> The enemy finished on <b>${G.enemyVP} VP</b>
    (${band}${band!=='Defeat'?` — the next band down begins at ${bandBar().find(v=>v[0]===band)[1]+1}`:''}).
    You destroyed <b>${N.kills}</b> of the ${S.cruiseSpawned+S.droneSpawned+G.ballisticLaunched} weapons launched at you —
    ${pc(N.cruiseRate)}% of the cruise missiles and ${G.ballisticLaunched?pc(N.ballRate)+'% of the ballistics':'no ballistics were fired'}.</p>`);

  // --- what actually drove the score
  const src=[['the cities',S.vp.cities],['ballistic strikes',S.vp.ballistic],
             ['damage to military sites',S.vp.milDamage],['installations written off',S.vp.writeOff],
             ['squadrons lost',S.vp.squadrons]].sort((a,b)=>b[1]-a[1]);
  const top=src[0];
  if(top[1]>0){
    let why='';
    if(top[0]==='the cities') why=`Cities cannot be destroyed, so every leaker that reached one kept scoring. Stopping the missile is the only defence — there is no absorbing it.`;
    else if(top[0]==='ballistic strikes') why=`Ballistic missiles did the damage. Each needs an ABM battery or a BMD destroyer within 4 hexes of its <i>aimpoint</i>, and you get one turn's warning — coverage has to be in place before the launch, not after.`;
    else if(top[0]==='installations written off') why=`Losing whole installations, not the cratering, is what cost you. A site written off hands the enemy a lump sum and takes its squadrons with it.`;
    else if(top[0]==='squadrons lost') why=`Your air arm was the expensive casualty. Squadrons caught on the ground when a field is struck are pure loss — dispersal, or launching before the wave arrives, is the counter.`;
    else why=`Military installations absorbed the weight. That is the cheaper way to lose ground: once a site is wrecked it stops scoring for the enemy entirely.`;
    out.push(`<p>The largest single source was <b class="hl">${top[0]} (${top[1]} VP)</b>. ${why}</p>`);
  }

  // --- the diagnosis: ammunition or coverage?
  if(N.fired===0){
    out.push(`<p>You did not fire a single round. Nothing was ever in range of anything.</p>`);
  } else if(N.unspent > N.fired*0.6){
    out.push(`<p><b class="hl">You finished with ${N.unspent} rounds unfired against ${N.fired} spent.</b>
      That is a coverage problem, not a supply problem — the missiles went where your launchers were not.
      Points spent on magazines would have been better spent on radars, another battery, or simply
      positioning what you had closer to the likely aim points.</p>`);
  } else if(N.unspent < 8){
    out.push(`<p><b class="hl">You ran the magazines dry (${N.unspent} rounds left).</b>
      The engagements were there; the ammunition was not. More reserve, or stricter discipline about
      double-tapping low-value contacts, would have kept something back for the last wave.</p>`);
  } else {
    out.push(`<p>Ammunition and opportunity were reasonably matched — ${N.fired} rounds fired,
      ${N.unspent} still in hand at the end.</p>`);
  }

  // --- what the jamming cost, and how it is beaten
  if(S.ghostSpawned){
    const burnPc=pc(N.ghostBurnRate);
    if(S.ghostRounds){
      out.push(`<p><b class="hl">${S.ghostSpawned} of the tracks you saw were jamming ghosts</b>, and you put
        <b class="hl">${S.ghostRounds} round${S.ghostRounds>1?'s':''}</b> — about ${N.ghostSpend} points of
        interceptor — into empty air. That is what OECM is for: it does not have to destroy anything, it only
        has to make you spend. You burned through ${burnPc} of them before firing.
        ${N.ghostBurnRate<0.5?`A sensor close enough resolves a ghost for what it is, but only just: ${BURN.F5} hexes
        for an airborne 5th-gen, ${BURN.RADAR} for a radar, and an ordinary battery has to have it fly directly
        overhead. Pushing the fighter at a suspicious contact costs a move; it buys back rounds.`
        :`Your forward sensors were doing real work.`}</p>`);
    } else {
      out.push(`<p><b class="hl">${S.ghostSpawned} of the tracks you saw were jamming ghosts</b>, and you did not
        waste a single round on one — ${burnPc} were burned through and the rest faded on their own. That is
        as clean as the electronic fight gets.</p>`);
    }
  }

  // --- losses worth remarking on
  const L=S.lost, bits=[];
  if(L.sites) bits.push(`${L.sites} military site${L.sites>1?'s':''} written off`);
  if(L.squadrons) bits.push(`${L.squadrons} squadron${L.squadrons>1?'s':''} destroyed`);
  if(L.batteries) bits.push(`${L.batteries} batter${L.batteries>1?'ies':'y'} lost to SEAD`);
  if(L.radars) bits.push(`${L.radars} radar${L.radars>1?'s':''} lost`);
  if(bits.length){
    let note='';
    if(L.radars) note=` Losing radar cover is the worst of these — a blinded battery is cut to a one-hex self-defence bubble.`;
    else if(L.batteries) note=` Ballistic SEAD hunts your heaviest launcher first; relocating a battery during a lull is the only way to break the aim point.`;
    else if(L.squadrons>1) note=` Squadrons are worth 3–5 VP each to the enemy on top of the capability you lose.`;
    out.push(`<p>Your losses: <b class="hl">${bits.join(', ')}</b>.${note}</p>`);
  } else {
    out.push(`<p>You came through with <b class="hl">no losses at all</b> — every installation, battery,
      radar and squadron survived the campaign intact.</p>`);
  }

  // --- exchange rate
  if(N.kills){
    const eff = N.perKill<=6?'an efficient exchange':N.perKill<=10?'a fair exchange':'an expensive exchange';
    out.push(`<p>You expended <b class="hl">${N.spend} points of interceptors</b> for ${N.kills} kills —
      ${N.perKill.toFixed(1)} points per kill, ${eff}. What got through was worth
      ${N.leakVal} points to the enemy.</p>`);
  }
  return out.join('');
}
function aarHTML(){
  const S=G.stats, N=aarNumbers();
  const pc=x=>Math.round(x*100)+'%';
  const row=(k,v,c)=>`<div class="frow"><span class="k">${k}</span><span${c?` style="color:${c}"`:''}>${v}</span></div>`;
  const vpRows=[['Cities struck',S.vp.cities],['Ballistic strikes',S.vp.ballistic],
    ['Military damage',S.vp.milDamage],['Installations written off',S.vp.writeOff],
    ['Squadrons lost',S.vp.squadrons]].filter(r=>r[1]>0).sort((a,b)=>b[1]-a[1]);
  return `<div class="brief">
    <div style="display:flex;align-items:baseline;justify-content:space-between;margin:2px 0 4px">
      <span style="font-size:26px;font-weight:700;color:${bandColour()}">${bandName()}</span>
      <span><b style="font-size:20px">${G.enemyVP}</b> <span class="k">enemy VP of ${ceilingNow()}</span></span></div>
    <div class="vpbar"><div style="width:${Math.min(100,G.enemyVP/ceilingNow()*100)}%"></div></div>
    <div class="bands" style="margin-top:8px">${bandBar().map(([n,c])=>
      `<span style="color:${bandColour(c)};border-color:${bandColour(c)};${n===bandName()?'font-weight:700':'opacity:.5'}">${n} ≤ ${c}</span>`).join('')}
      <span style="color:var(--bad);border-color:var(--bad);${bandName()==='Defeat'?'font-weight:700':'opacity:.5'}">Defeat &gt; ${bandBar()[bandBar().length-1][1]}</span></div>
    ${maxWaves()!==WAVES_DEFAULT?`<div class="hint">Thresholds scaled to a ${maxWaves()}-wave campaign.</div>`:''}
    <div class="hint"><b class="hl">${diffName()}</b> · <b class="hl">${doctrine().name}</b> SEAD doctrine.
      ${diffId()!==DEFAULT_DIFF?'Victory thresholds are the same at every difficulty — this result is directly comparable.':''}</div>

    <h4>Assessment</h4>
    ${evaluationHTML()}

    <h4>Where the enemy scored</h4>
    <div class="fsol">${vpRows.length?vpRows.map(r=>row(r[0],r[1]+' VP')).join('')
       :'<div class="frow k">Nothing scored — a clean sheet.</div>'}
      <div class="frow" style="border-top:1px solid var(--edge);margin-top:5px;padding-top:5px">
        <b>Total</b><b>${G.enemyVP} VP</b></div></div>

    <h4>The engagement</h4>
    <div class="fsol">
      ${row('Cruise missiles launched',S.cruiseSpawned)}
      ${row('— destroyed',`${S.cruiseKilled} (${S.cruiseSpawned?pc(N.cruiseRate):'—'})`,'var(--good)')}
      ${row('— leaked through',S.cruiseLeaked,S.cruiseLeaked?'var(--bad)':'')}
      ${S.droneSpawned?`
      ${row('Drones launched',S.droneSpawned)}
      ${row('— destroyed',`${S.droneKilled} (${pc(N.droneRate)})`,'var(--good)')}
      ${row('— leaked through',`${S.droneLeaked}${S.droneLeaked?` · ${S.droneLeaked*LEAK_VALUE.drone} pts of damage`:''}`,S.droneLeaked?'var(--warn)':'')}`:''}
      ${S.ghostSpawned?`
      ${row('Jamming ghosts on the scope',S.ghostSpawned)}
      ${row('— burned through',`${S.ghostBurned} (${pc(N.ghostBurnRate)})`,S.ghostBurned?'var(--good)':'')}
      ${row('— shot at before you knew',S.ghostShot,S.ghostShot?'var(--bad)':'')}
      ${row('— faded unchallenged',S.ghostFaded)}`:''}
      ${row('Ballistic missiles launched',G.ballisticLaunched)}
      ${row('— intercepted',`${S.ballKilled}${G.ballisticLaunched?` (${pc(N.ballRate)})`:''}`,'var(--good)')}
      ${row('— impacted',S.ballHit,S.ballHit?'var(--bad)':'')}
    </div>

    <h4>Your force</h4>
    <div class="fsol">
      ${row('Military sites',`${G.targets.filter(t=>!t.city&&!t.dead).length} of ${G.targets.filter(t=>!t.city).length} standing`)}
      ${row('Squadrons',`${G.aircraft.filter(a=>!a.dead).length} of ${G.aircraft.length} surviving`)}
      ${row('Batteries',`${G.units.filter(u=>!u.dead&&u.pool).length} of ${G.units.filter(u=>u.pool).length} surviving`)}
      ${row('Radars',`${radars().length} of ${G.units.filter(u=>u.sensor).length} surviving`)}
    </div>

    <h4>Cost exchange</h4>
    <div class="fsol">
      ${row('Rounds fired',`${N.fired} (${N.spend} pts)`)}
      ${Object.keys(ROUND_COST).filter(k=>S.rounds[k]).map(k=>
        row(`— ${k==='AAM'?'air-to-air':k}`,`${S.rounds[k]} × ${ROUND_COST[k]} pts`)).join('')}
      ${row('Rounds unfired at the end',N.unspent,N.unspent>40?'var(--warn)':'')}
      ${S.ghostRounds?row('— of those, into jamming ghosts',`${S.ghostRounds} (${N.ghostSpend} pts)`,'var(--warn)'):''}
      ${N.kills?row('Cost per kill',N.perKill.toFixed(1)+' pts'):''}
      ${row('Value of what leaked',N.leakVal+' pts','var(--bad)')}
    </div>

    <div class="step" style="margin-top:16px">
      <button class="primary" id="aarNew">↻ New campaign</button>
      <button id="aarClose">Close</button>
    </div></div>`;
}
function openAAR(){
  const m=document.getElementById('modal');
  document.getElementById('modalTitle').textContent='After-action report';
  const body=document.getElementById('modalBody');
  body.innerHTML=aarHTML(); body.scrollTop=0;
  m.classList.add('on');
  const n=document.getElementById('aarNew');
  if(n) n.onclick=()=>{ closeModal(); newGame(); render(); };
  const c=document.getElementById('aarClose'); if(c) c.onclick=closeModal;
}

function openBriefing(){
  const m=document.getElementById('modal');
  const scn=SCENARIOS.find(s=>s.id===G.scenarioId);
  document.getElementById('modalTitle').textContent=scn?scn.name:'INTERCEPT — Briefing';
  const body=document.getElementById('modalBody');
  body.innerHTML=briefingHTML(); body.scrollTop=0;
  m.classList.add('on');
  const b=document.getElementById('brBegin'); if(b) b.onclick=closeModal;
  const f=document.getElementById('brFull');  if(f) f.onclick=openHelp;
}
function closeModal(){ document.getElementById('modal').classList.remove('on'); }
document.getElementById('modalClose').onclick=closeModal;
document.getElementById('modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  if(document.getElementById('modal').classList.contains('on')) closeModal();
  else closePopup();
});

// ================= boot =================
newGame(); render(); openBriefing();
</script>
